<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Belalang Sembah - .Feast (Colored ASCII Lyric Visualizer)</title>
  
  <!-- Font Monospace & Font Tematik Google: Space Grotesk, Playfair Display, Cinzel, JetBrains Mono, DotGothic16, Anton -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@700;900&family=DotGothic16&family=JetBrains+Mono:wght@700&family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <!-- Modular Styling -->
  <link rel="stylesheet" href="style.css">

<body>

<div class="container">
  <div id="output-wrapper">

    <div id="ascii-container"></div>
  </div>
</div>

<!-- Pemutar Audio Musik (.Feast - Belalang Sembah) -->
<audio id="audio-player" preload="auto">

  <source src="Feast - Belalang Sembah (Official Music Video).mp3" type="audio/mpeg">
  <source src="audio.mp3" type="audio/mpeg">
  <source src="belalang_sembah.mp3" type="audio/mpeg">
</audio>

<!-- Modular Script Mesin Colored ASCII Lyric Visualizer -->
<script src="visualizer.js"></script>

</html>
