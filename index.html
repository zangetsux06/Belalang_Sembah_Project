<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Belalang Sembah - ASCII Visualizer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* BACKGROUND 100% HITAM PEKAT MURNI - TANPA GRADASI */
    html, body {
      background-color: #000000 !important;
      background: #000000 !important;
      color: #ff1744;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      font-family: "SF Mono", "Cascadia Code", Consolas, "Courier New", monospace;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      position: relative;
    }

    #output-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.08s ease-out;
    }

    #output-wrapper.glitching {
      animation: glitch-anim 0.14s steps(2) forwards;
    }

    #output {
      text-align: center;
      font-family: inherit;
      font-weight: 700;
      letter-spacing: 0.05em;
      white-space: pre;
      background: transparent !important;
      font-size: 13px;
      line-height: 1.08;
      cursor: pointer;
      display: block;
    }

    /* Indikator Pemutar Audio jika ditahan autoplay browser */
    #audio-prompt {
      position: absolute;
      bottom: 24px;
      display: none;
      align-items: center;
      gap: 10px;
      padding: 10px 24px;
      border-radius: 30px;
      background: rgba(255, 23, 68, 0.18);
      border: 1px solid rgba(255, 23, 68, 0.5);
      color: #ff3366;
      font-size: 12px;
      letter-spacing: 0.08em;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(255, 23, 68, 0.35);
      animation: pulse-btn 2s infinite ease-in-out;
      z-index: 50;
    }

    #audio-prompt:hover {
      background: rgba(255, 23, 68, 0.35);
      transform: scale(1.04);
    }

    @keyframes pulse-btn {
      0%, 100% { opacity: 0.75; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); box-shadow: 0 0 25px rgba(255, 23, 68, 0.65); }
    }

    @keyframes glitch-anim {
      0% { transform: translate(0, 0); }
      30% { transform: translate(-3px, 1px) skewX(-2deg); filter: contrast(1.5) brightness(1.3); }
      70% { transform: translate(3px, -1px) skewX(1.5deg); }
      100% { transform: translate(0, 0); }
    }

    #prerender {
      display: none;
      position: absolute;
      left: 0;
      top: 0;
    }
  </style>
</head>
<body>

<div class="container">
  <div id="output-wrapper">
    <pre id="output"></pre>
  </div>
</div>

<div id="audio-prompt">
  ▶ Klik di mana saja untuk memutar lagu
</div>

<canvas id="prerender" width="120" height="56"></canvas>

<!-- Pemutar Audio Musik -->
<audio id="audio-player" preload="auto">
  <source src="Feast%20-%20Belalang%20Sembah%20(Official%20Music%20Video).mp3" type="audio/mpeg">
  <source src="Feast - Belalang Sembah (Official Music Video).mp3" type="audio/mpeg">
  <source src="audio.mp3" type="audio/mpeg">
  <source src="belalang_sembah.mp3" type="audio/mpeg">
</audio>

<script>
  (() => {
    // =========================================================================
    // KONFIGURASI LIRIK: 1 KATA 1 GELOMBANG (PRE-CHORUS & CHORUS 1)
    // =========================================================================
    const config = {
      lyrics: [
        // --- 1. PRE-CHORUS ---
        {
          wordsLine1: ["Namun", "sabun", "kita"],
          wordsLine2: ["berbeda", "wangi"],
          startSec: 67.5,
          endSec: 72.8,
          showMs: 5300,
          hideMs: 600
        },
        {
          wordsLine1: ["Dan", "tubuhmu", "dibalut"],
          wordsLine2: ["hal", "berbeda", "tiap", "malam"],
          startSec: 73.4,
          endSec: 80.2,
          showMs: 6800,
          hideMs: 600
        },
        {
          wordsLine1: ["Saat", "ini", "ku", "masih"],
          wordsLine2: ["figuran", "buram"],
          startSec: 80.8,
          endSec: 85.0,
          showMs: 4200,
          hideMs: 400
        },

        // --- 2. CHORUS 1 (BAGIAN VIRAL) ---
        {
          wordsLine1: ["Tapi", "jadikanku"],
          wordsLine2: ["belalang", "sembah"],
          startSec: 85.4,
          endSec: 93.4,
          showMs: 8000,
          hideMs: 400,
          isChorus: true
        },
        {
          wordsLine1: ["Walau", "sebentar"],
          wordsLine2: ["kupercaya", "indah"],
          startSec: 93.8,
          endSec: 101.0,
          showMs: 7200,
          hideMs: 400,
          isChorus: true
        },
        {
          wordsLine1: ["Seberapa", "banyak,"],
          wordsLine2: ["seberapa", "mahal"],
          startSec: 101.4,
          endSec: 105.4,
          showMs: 4000,
          hideMs: 300
        },
        {
          wordsLine1: ["Semua", "'kan", "kuberi"],
          wordsLine2: [],
          startSec: 105.7,
          endSec: 107.9,
          showMs: 2200,
          hideMs: 200
        },
        {
          wordsLine1: ["Semua", "'kan", "kugadai"],
          wordsLine2: [],
          startSec: 108.1,
          endSec: 110.6,
          showMs: 2500,
          hideMs: 300
        },
        {
          wordsLine1: ["Matikan", "aku"],
          wordsLine2: ["setelah", "usai"],
          startSec: 110.9,
          endSec: 114.6,
          showMs: 3700,
          hideMs: 300
        },
        {
          wordsLine1: ["Matikan", "aku"],
          wordsLine2: ["setelah", "usai"],
          startSec: 114.9,
          endSec: 118.5,
          showMs: 3600,
          hideMs: 8500
        }
      ],

      audioStartTime: 67.0,   // Mulai detik 67.0 (01:07.0)
      audioEndTime: 127.0,     // Selesai detik 127.0 (02:07.0) = Tepat 60 Detik
      isLooping: true
    };

    // =========================================================================
    // CANVAS & SISTEM RENDER
    // =========================================================================
    const canvas = document.getElementById("prerender");
    const output = document.getElementById("output");
    const outputWrapper = document.getElementById("output-wrapper");
    const audioElement = document.getElementById("audio-player");
    const audioPrompt = document.getElementById("audio-prompt");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });

    // Karakter shading ASCII klasik (tegas, kontur bersih, mudah dibaca)
    const charsFixed = [" ", ".", ":", "-", "=", "+", "*", "#", "%", "@"];
    const charsLength = charsFixed.length;

    let currentLyricIndex = 0;
    let lastTime = 0;
    let timeAccumulator = 0;
    let isShowing = true;
    let isPaused = false;
    let isGlitchActive = false;
    let glitchTimeout = null;

    const triggerGlitch = (duration = 140) => {
      isGlitchActive = true;
      if (outputWrapper) outputWrapper.classList.add("glitching");
      clearTimeout(glitchTimeout);
      glitchTimeout = setTimeout(() => {
        isGlitchActive = false;
        if (outputWrapper) outputWrapper.classList.remove("glitching");
      }, duration);
    };

    // Glitch periodik acak
    setInterval(() => {
      if (!isPaused && isShowing && Math.random() < 0.28) {
        triggerGlitch(80);
      }
    }, 3800);

    // =========================================================================
    // AUDIO AUTOPLAY & INTERAKSI
    // =========================================================================
    const playAudio = () => {
      if (!audioElement) return;
      if (audioElement.currentTime < config.audioStartTime || audioElement.currentTime >= (config.audioEndTime || 9999)) {
        audioElement.currentTime = config.audioStartTime;
      }
      const p = audioElement.play();
      if (p !== undefined) {
        p.then(() => {
          if (audioPrompt) audioPrompt.style.display = "none";
          isPaused = false;
        }).catch(() => {
          if (audioPrompt) audioPrompt.style.display = "flex";
        });
      }
    };

    const handleUserInteraction = () => {
      if (!audioElement) return;
      if (audioElement.paused) {
        playAudio();
      } else {
        audioElement.pause();
        isPaused = true;
      }
    };

    window.addEventListener("click", handleUserInteraction);
    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        handleUserInteraction();
      } else if (e.code === "ArrowRight") {
        e.preventDefault();
        currentLyricIndex = (currentLyricIndex + 1) % config.lyrics.length;
        timeAccumulator = 0;
        isShowing = true;
        triggerGlitch(160);
        if (audioElement && config.lyrics[currentLyricIndex].startSec !== undefined) {
          audioElement.currentTime = config.lyrics[currentLyricIndex].startSec;
        }
      } else if (e.code === "ArrowLeft") {
        e.preventDefault();
        currentLyricIndex = (currentLyricIndex - 1 + config.lyrics.length) % config.lyrics.length;
        timeAccumulator = 0;
        isShowing = true;
        triggerGlitch(160);
        if (audioElement && config.lyrics[currentLyricIndex].startSec !== undefined) {
          audioElement.currentTime = config.lyrics[currentLyricIndex].startSec;
        }
      }
    });

    window.addEventListener("DOMContentLoaded", () => {
      playAudio();
    });

    // =========================================================================
    // GAMBAR ASET ATMOSFER: SILUET BELALANG SEMBAH (PRAYING MANTIS)
    // Terletak di bagian bawah layar seperti referensi gambar 1
    // =========================================================================
    const drawMantisAsset = (time, isChorus) => {
      const cx = canvas.width / 2;
      const baseY = canvas.height - 1;

      // Animasi bernapas halus & antena meliuk
      const breathe = Math.sin(time * 0.003) * 1.0;
      const antennaWave = Math.sin(time * 0.004) * 2.2;
      const eyeGlow = isChorus ? 255 : 220;

      ctx.save();

      // 1. Kepala Segitiga
      const headY = baseY - 18 + breathe;
      ctx.fillStyle = "white";
      ctx.beginPath();
      ctx.moveTo(cx, headY);
      ctx.lineTo(cx - 4.5, headY - 5.5);
      ctx.lineTo(cx + 4.5, headY - 5.5);
      ctx.closePath();
      ctx.fill();

      // 2. Mata Majemuk (Compound Eyes)
      ctx.beginPath();
      ctx.arc(cx - 5.5, headY - 6.5, 2, 0, Math.PI * 2);
      ctx.arc(cx + 5.5, headY - 6.5, 2, 0, Math.PI * 2);
      ctx.fill();

      // 3. Antena Meliuk Dinamis
      ctx.strokeStyle = "white";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx - 2, headY - 5.5);
      ctx.quadraticCurveTo(cx - 7 + antennaWave, headY - 12, cx - 13 + antennaWave * 1.4, headY - 17);
      ctx.moveTo(cx + 2, headY - 5.5);
      ctx.quadraticCurveTo(cx + 7 - antennaWave, headY - 12, cx + 13 - antennaWave * 1.4, headY - 17);
      ctx.stroke();

      // 4. Batang Tubuh / Prothorax
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(cx, headY);
      ctx.lineTo(cx, baseY - 8);
      ctx.stroke();

      // 5. Tangan Cakar Raksasa "Sembah" (Raptorial Claws)
      ctx.lineWidth = 2;
      const armShift = isChorus ? Math.sin(time * 0.006) * 2 : 0;
      // Tangan Kiri
      ctx.beginPath();
      ctx.moveTo(cx - 2, headY + 3);
      ctx.lineTo(cx - 11 - armShift, headY - 2);
      ctx.lineTo(cx - 6, headY + 7);
      ctx.stroke();

      // Tangan Kanan
      ctx.beginPath();
      ctx.moveTo(cx + 2, headY + 3);
      ctx.lineTo(cx + 11 + armShift, headY - 2);
      ctx.lineTo(cx + 6, headY + 7);
      ctx.stroke();

      // 6. Sayap & Perut Bersegmen
      ctx.beginPath();
      ctx.moveTo(cx, baseY - 8);
      ctx.lineTo(cx - 8, baseY);
      ctx.lineTo(cx + 8, baseY);
      ctx.closePath();
      ctx.fill();

      // 7. Kaki Belakang
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx - 2, baseY - 7);
      ctx.lineTo(cx - 16, baseY - 3);
      ctx.lineTo(cx - 25, baseY);
      ctx.moveTo(cx + 2, baseY - 7);
      ctx.lineTo(cx + 18, baseY - 3);
      ctx.lineTo(cx + 25, baseY);
      ctx.stroke();

      ctx.restore();
    };

    // =========================================================================
    // RENDER LIRIK: 1 KATA 1 GELOMBANG
    // Setiap kata memiliki gelombang dan highlight sesuai beat vokal
    // =========================================================================
    const drawWaveWords = (words, startY, globalWordIdxOffset, totalWordsInItem, progress, time) => {
      if (!words || words.length === 0) return;

      const spaceW = ctx.measureText(" ").width;
      const wordWidths = words.map(w => ctx.measureText(w).width);
      const totalLineW = wordWidths.reduce((a, b) => a + b, 0) + (words.length - 1) * spaceW;

      let curX = (canvas.width - totalLineW) / 2;

      for (let i = 0; i < words.length; i++) {
        const word = words[i];
        const wWidth = wordWidths[i];
        const wordGlobalIdx = globalWordIdxOffset + i;

        // Hitung apakah kata ini sedang aktif dinyanyikan pada progress saat ini
        const wordFracStart = wordGlobalIdx / totalWordsInItem;
        const wordFracEnd = (wordGlobalIdx + 1) / totalWordsInItem;

        const isCurrentWord = (progress >= wordFracStart && progress < wordFracEnd);
        const isPastWord = (progress >= wordFracEnd);

        // 1 Kata 1 Gelombang: Kata aktif melambung naik dalam gelombang sinus
        let waveY = 0;
        if (isCurrentWord) {
          const wordLocalProg = (progress - wordFracStart) / (wordFracEnd - wordFracStart);
          waveY = -Math.sin(wordLocalProg * Math.PI) * 3.5;
        } else {
          waveY = Math.sin(time * 0.0035 + wordGlobalIdx * 0.9) * 0.7;
        }

        ctx.save();
        if (isCurrentWord) {
          // Kata yang sedang dinyanyikan: PUTIH TERANG MENYALA (menjadi merah scarlet di ASCII)
          ctx.fillStyle = "white";
          ctx.fillText(word, curX + wWidth / 2, startY + waveY);
        } else if (isPastWord) {
          // Kata yang sudah selesai dinyanyikan: MERAH PEKAT STABIL
          ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
          ctx.fillText(word, curX + wWidth / 2, startY + waveY);
        } else {
          // Kata yang belum tiba giliran: BAYANGAN SAMAR DI KEGELAPAN
          ctx.fillStyle = "rgba(255, 255, 255, 0.22)";
          ctx.fillText(word, curX + wWidth / 2, startY + waveY);
        }
        ctx.restore();

        curX += wWidth + spaceW;
      }
    };

    // =========================================================================
    // RENDER CANVAS UTAMA (LIRIK DI ATAS + BELALANG SEMBAH DI BAWAH)
    // =========================================================================
    const drawTextToCanvas = (time) => {
      const w = canvas.width;
      const h = canvas.height;

      ctx.fillStyle = "black";
      ctx.fillRect(0, 0, w, h);

      const currentItem = config.lyrics[currentLyricIndex];
      const isChorus = currentItem ? !!currentItem.isChorus : false;

      // 1. Gambar siluet Belalang Sembah di bagian bawah kanvas
      drawMantisAsset(time, isChorus);

      // 2. Gambar lirik dengan efek gelombang kata di bagian atas kanvas
      if (!isShowing || !currentItem) return;

      const words1 = currentItem.wordsLine1 || [];
      const words2 = currentItem.wordsLine2 || [];
      const totalWords = words1.length + words2.length;

      // Hitung progress waktu di dalam baris lirik saat ini (0.0 s/d 1.0)
      let progress = 0;
      if (audioElement && !audioElement.paused && audioElement.duration > 0) {
        const curT = audioElement.currentTime;
        const dur = (currentItem.endSec - currentItem.startSec) || 1;
        progress = Math.min(1, Math.max(0, (curT - currentItem.startSec) / dur));
      } else {
        const dur = currentItem.showMs || 3000;
        progress = Math.min(1, Math.max(0, timeAccumulator / dur));
      }

      ctx.font = `bold 12.5px "Segoe UI", Arial, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const hasLine2 = words2.length > 0;
      const line1Y = hasLine2 ? 8 : 12;
      const line2Y = 20;

      // Baris 1
      drawWaveWords(words1, line1Y, 0, totalWords, progress, time);
      // Baris 2
      if (hasLine2) {
        drawWaveWords(words2, line2Y, words1.length, totalWords, progress, time);
      }
    };

    // =========================================================================
    // LOOP ANIMASI ASCII REAL-TIME
    // =========================================================================
    const updateASCII = (time) => {
      if (!isPaused) {
        if (audioElement && !audioElement.paused && audioElement.duration > 0) {
          const curTime = audioElement.currentTime;

          // Cek batas akhir klip 1 menit
          if (config.audioEndTime && curTime >= config.audioEndTime) {
            if (config.isLooping) {
              audioElement.currentTime = config.audioStartTime;
              currentLyricIndex = 0;
              isShowing = true;
              triggerGlitch(180);
            } else {
              isPaused = true;
              audioElement.pause();
            }
            return;
          }

          let matched = false;

          for (let i = 0; i < config.lyrics.length; i++) {
            const item = config.lyrics[i];
            if (item.startSec !== undefined && item.endSec !== undefined) {
              if (curTime >= item.startSec && curTime <= item.endSec) {
                if (currentLyricIndex !== i) {
                  currentLyricIndex = i;
                  triggerGlitch(160);
                }
                isShowing = true;
                matched = true;
                break;
              } else if (i < config.lyrics.length - 1 && curTime > item.endSec && curTime < config.lyrics[i + 1].startSec) {
                currentLyricIndex = i;
                isShowing = false;
                matched = true;
                break;
              } else if (i === config.lyrics.length - 1 && curTime > item.endSec) {
                currentLyricIndex = i;
                isShowing = false;
                matched = true;
                break;
              }
            }
          }

          if (!matched && config.lyrics.length > 0) {
            if (curTime < config.audioStartTime) {
              audioElement.currentTime = config.audioStartTime;
              isShowing = true;
            }
          }
        } else {
          // Fallback akumulasi waktu jika audio ditahan browser
          if (lastTime === 0) lastTime = time;
          const deltaTime = time - lastTime;
          timeAccumulator += deltaTime;

          const currentLyric = config.lyrics[currentLyricIndex];
          const currentPhaseDuration = isShowing ? currentLyric.showMs : currentLyric.hideMs;

          if (timeAccumulator > currentPhaseDuration) {
            timeAccumulator = 0;
            if (isShowing) {
              isShowing = false;
            } else {
              isShowing = true;
              currentLyricIndex++;
              if (currentLyricIndex >= config.lyrics.length) {
                currentLyricIndex = config.isLooping ? 0 : config.lyrics.length - 1;
              }
              triggerGlitch(160);
            }
          }
        }
      }
      lastTime = time;

      drawTextToCanvas(time);

      const w = canvas.width;
      const h = canvas.height;
      const data = ctx.getImageData(0, 0, w, h).data;

      let outputText = "";
      
      for (let y = 0; y < h; y += 2) { // Sampling y step=2 untuk perbaikan proporsi rasio tinggi monospace
        let row = "";
        for (let x = 0; x < w; x++) {
          const index = (x + y * w) * 4;
          const r = data[index];
          const g = data[index + 1];
          const b = data[index + 2];
          const c = (r + g + b) / 3;

          if (c < 24) {
            row += " ";
          } else {
            let char;
            if (isGlitchActive && Math.random() < 0.16) {
              const glitchGlyphs = ["†", "‡", "§", "ø", "X", "✦", "#", "!", "?"];
              char = glitchGlyphs[Math.floor(Math.random() * glitchGlyphs.length)];
            } else {
              const charIndex = Math.floor((charsLength * c) / 255);
              const safeCharIndex = Math.min(Math.max(charIndex, 0), charsLength - 1);
              char = charsFixed[safeCharIndex];
            }

            // Pewarnaan Berjenjang & Pendaran Merah
            let charColor, glow;
            if (c > 200) {
              // Inti kata yang aktif sedang dinyanyikan
              const brightReds = ["#ff1744", "#ff2a55", "#ff003b", "#ff3366"];
              charColor = brightReds[(x + y) % brightReds.length];
              glow = `0 0 6px ${charColor}, 0 0 14px rgba(255, 23, 68, 0.75)`;
            } else if (c > 130) {
              // Kata yang sudah dinyanyikan / tubuh siluet belalang
              const midReds = ["#e50914", "#dc143c", "#c00028"];
              charColor = midReds[(x + y) % midReds.length];
              glow = `0 0 4px rgba(220, 20, 60, 0.55)`;
            } else if (c > 65) {
              // Kata yang akan datang / kontur kaki belalang
              charColor = "#a80020";
              glow = "none";
            } else {
              charColor = "#550010";
              glow = "none";
            }

            if (glow !== "none") {
              row += `<span style="color:${charColor};text-shadow:${glow};">${char}</span>`;
            } else {
              row += `<span style="color:${charColor};">${char}</span>`;
            }
          }
        }
        outputText += row + "\n";
      }

      output.innerHTML = outputText;

      requestAnimationFrame(updateASCII);
    };

    requestAnimationFrame(updateASCII);
  })();
</script>

</body>
</html>
