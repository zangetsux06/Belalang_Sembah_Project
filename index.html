<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Belalang Sembah - .Feast (Real-Time Colored ASCII Lyric Visualizer)</title>
  
  <!-- Font Google: Space Grotesk & Inter untuk Tipografi Bersih & Rongga Huruf Terbuka -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">

  <!-- Modular Styling -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div id="output-wrapper">
    <!-- Layer Aura Halus di Belakang (CSS) agar tidak bocor menjadi titik-titik ASCII -->
    <div id="bg-aura"></div>

    <!-- Kontainer Render Real-Time Colored ASCII Art -->
    <div id="ascii-container"></div>
  </div>
</div>

<!-- Pemutar Audio Musik (.Feast - Belalang Sembah) -->
<audio id="audio-player" preload="auto">
  <source src="Feast%20-%20Belalang%20Sembah%20(Official%20Music%20Video).mp3" type="audio/mpeg">
  <source src="Feast - Belalang Sembah (Official Music Video).mp3" type="audio/mpeg">
  <source src="audio.mp3" type="audio/mpeg">
  <source src="belalang_sembah.mp3" type="audio/mpeg">
</audio>

<!-- Modular Script Mesin Colored ASCII Lyric Visualizer -->
<script src="visualizer.js"></script>

</body>
</html>
