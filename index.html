<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Belalang Sembah - .Feast (Stockholm Metro Dot Matrix)</title>
  
  <!-- Font Google: Space Grotesk (Stockholm Metro Font), Cinzel, Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Cinzel:wght@700;900&family=Montserrat:wght@800;900&family=DotGothic16&display=swap" rel="stylesheet">

  <!-- Modular Styling -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div id="output-wrapper">
    <!-- Canvas Utama Mesin Tipografi Stockholm Metro Dot Matrix -->
    <canvas id="matrix-canvas" width="960" height="540"></canvas>
  </div>
</div>

<!-- Pemutar Audio Musik (.Feast - Belalang Sembah) -->
<audio id="audio-player" preload="auto">
  <source src="Feast%20-%20Belalang%20Sembah%20(Official%20Music%20Video).mp3" type="audio/mpeg">
  <source src="Feast - Belalang Sembah (Official Music Video).mp3" type="audio/mpeg">
  <source src="audio.mp3" type="audio/mpeg">
  <source src="belalang_sembah.mp3" type="audio/mpeg">
</audio>

<!-- Modular Script Mesin Dot Matrix Visualizer & Pengaturan Lirik -->
<script src="visualizer.js"></script>

</body>
</html>
