<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Belalang Sembah - Visualizer</title>
  
  <!-- Font bertema obsesi, gothic romance, dan dark adoration -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@700;900&family=Playfair+Display:ital,wght@1,700;1,900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">

  <!-- Modular Styling -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div id="output-wrapper">

  </div>

<audio id="audio-player" preload="auto">
  <source src="Feast%20-%20Belalang%20Sembah%20(Official%20Music%20Video).mp3" type="audio/mpeg">
  <source src="Feast - Belalang Sembah (Official Music Video).mp3" type="audio/mpeg">
  <source src="audio.mp3" type="audio/mpeg">
  <source src="belalang_sembah.mp3" type="audio/mpeg">
</audio>

<!-- Modular Script Mesin Visualizer & Pengaturan Lirik -->
<script src="visualizer.js"></script>
