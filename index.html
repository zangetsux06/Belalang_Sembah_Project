<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Belalang Sembah - ASCII Visualizer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* BACKGROUND 100% HITAM PEKAT MURNI - TANPA GRADASI */
    html, body {
      background-color: #000000 !important;
      background: #000000 !important;
      color: #ff1744;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      font-family: "SF Mono", "Cascadia Code", Consolas, "Courier New", monospace;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      position: relative;
    }

    #output-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.08s ease-out;
    }

    #output-wrapper.glitching {
      animation: glitch-anim 0.14s steps(2) forwards;
    }

    #output {
      text-align: center;
      font-family: inherit;
      font-weight: 700;
      letter-spacing: 0.05em;
      white-space: pre;
      background: transparent !important;
      font-size: 13px;
      line-height: 1.1;
      cursor: pointer;
      display: block;
    }

    /* Indikator Pemutar Audio jika ditahan autoplay browser */
    #audio-prompt {
      position: absolute;
      bottom: 24px;
      display: none;
      align-items: center;
      gap: 10px;
      padding: 10px 24px;
      border-radius: 30px;
      background: rgba(255, 23, 68, 0.18);
      border: 1px solid rgba(255, 23, 68, 0.5);
      color: #ff3366;
      font-size: 12px;
      letter-spacing: 0.08em;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(255, 23, 68, 0.35);
      animation: pulse-btn 2s infinite ease-in-out;
      z-index: 50;
    }

    #audio-prompt:hover {
      background: rgba(255, 23, 68, 0.35);
      transform: scale(1.04);
    }

    @keyframes pulse-btn {
      0%, 100% { opacity: 0.75; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); box-shadow: 0 0 25px rgba(255, 23, 68, 0.65); }
    }

    @keyframes glitch-anim {
      0% { transform: translate(0, 0); }
      30% { transform: translate(-3px, 1px) skewX(-2deg); filter: contrast(1.5) brightness(1.3); }
      70% { transform: translate(3px, -1px) skewX(1.5deg); }
      100% { transform: translate(0, 0); }
    }

    #prerender {
      display: none;
      position: absolute;
      left: 0;
      top: 0;
    }
  </style>
</head>
<body>

<div class="container">
  <div id="output-wrapper">
    <pre id="output"></pre>
  </div>
</div>

<div id="audio-prompt">
  ▶ Klik di mana saja untuk memutar lagu
</div>

<canvas id="prerender" width="124" height="62"></canvas>

<!-- Pemutar Audio Musik -->
<audio id="audio-player" preload="auto">
  <source src="Feast%20-%20Belalang%20Sembah%20(Official%20Music%20Video).mp3" type="audio/mpeg">
  <source src="Feast - Belalang Sembah (Official Music Video).mp3" type="audio/mpeg">
  <source src="audio.mp3" type="audio/mpeg">
  <source src="belalang_sembah.mp3" type="audio/mpeg">
</audio>

<script>
  (() => {
    // =========================================================================
    // KONFIGURASI LIRIK: KATA PER KATA MUNCUL SESUAI PENYEBUTAN VOKAL
    // (Lirik yang belum dinyanyikan tidak akan muncul di layar)
    // =========================================================================
    const config = {
      lyrics: [
        // --- MOMENT 1: 01:07.0 - 01:25.0 (PRE-CHORUS / FIGURAN BURAM) ---
        {
          startSec: 67.5,
          endSec: 72.8,
          showMs: 5300,
          hideMs: 600,
          words: [
            { text: "Namun", time: 67.5, line: 1 },
            { text: "sabun", time: 68.4, line: 1 },
            { text: "kita", time: 69.6, line: 1 },
            { text: "berbeda", time: 70.4, line: 2 },
            { text: "wangi", time: 71.5, line: 2 }
          ]
        },
        {
          startSec: 73.4,
          endSec: 80.2,
          showMs: 6800,
          hideMs: 600,
          words: [
            { text: "Dan", time: 73.4, line: 1 },
            { text: "tubuhmu", time: 74.0, line: 1 },
            { text: "dibalut", time: 75.2, line: 1 },
            { text: "hal", time: 76.5, line: 2 },
            { text: "berbeda", time: 77.2, line: 2 },
            { text: "tiap", time: 78.5, line: 2 },
            { text: "malam", time: 79.2, line: 2 }
          ]
        },
        {
          startSec: 80.8,
          endSec: 85.0,
          showMs: 4200,
          hideMs: 400,
          words: [
            { text: "Saat", time: 80.8, line: 1 },
            { text: "ini", time: 81.3, line: 1 },
            { text: "ku", time: 81.8, line: 1 },
            { text: "masih", time: 82.2, line: 1 },
            { text: "figuran", time: 82.8, line: 2 },
            { text: "buram", time: 83.6, line: 2 }
          ]
        },

        // --- MOMENT 2: 01:25.0 - 01:45.5 (CHORUS 1 / BELALANG SEMBAH ALTAR) ---
        {
          startSec: 85.4,
          endSec: 93.4,
          showMs: 8000,
          hideMs: 400,
          words: [
            { text: "Tapi", time: 85.4, line: 1 },
            { text: "jadikanku", time: 86.8, line: 1 },
            { text: "belalang", time: 88.8, line: 2 },
            { text: "sembah", time: 91.0, line: 2 }
          ]
        },
        {
          startSec: 93.8,
          endSec: 101.0,
          showMs: 7200,
          hideMs: 400,
          words: [
            { text: "Walau", time: 93.8, line: 1 },
            { text: "sebentar", time: 95.2, line: 1 },
            { text: "kupercaya", time: 97.0, line: 2 },
            { text: "indah", time: 99.0, line: 2 }
          ]
        },
        {
          startSec: 101.4,
          endSec: 105.4,
          showMs: 4000,
          hideMs: 300,
          words: [
            { text: "Seberapa", time: 101.4, line: 1 },
            { text: "banyak,", time: 102.2, line: 1 },
            { text: "seberapa", time: 103.4, line: 2 },
            { text: "mahal", time: 104.2, line: 2 }
          ]
        },

        // --- MOMENT 3: 01:45.5 - 02:07.0 (MATIKAN AKU SETELAH USAI / STRIKE & ASH) ---
        {
          startSec: 105.7,
          endSec: 107.9,
          showMs: 2200,
          hideMs: 200,
          words: [
            { text: "Semua", time: 105.7, line: 1 },
            { text: "'kan", time: 106.3, line: 1 },
            { text: "kuberi", time: 106.8, line: 1 }
          ]
        },
        {
          startSec: 108.1,
          endSec: 110.6,
          showMs: 2500,
          hideMs: 300,
          words: [
            { text: "Semua", time: 108.1, line: 1 },
            { text: "'kan", time: 108.7, line: 1 },
            { text: "kugadai", time: 109.2, line: 1 }
          ]
        },
        {
          startSec: 110.9,
          endSec: 114.6,
          showMs: 3700,
          hideMs: 300,
          words: [
            { text: "Matikan", time: 110.9, line: 1 },
            { text: "aku", time: 111.8, line: 1 },
            { text: "setelah", time: 112.8, line: 2 },
            { text: "usai", time: 113.6, line: 2 }
          ]
        },
        {
          startSec: 114.9,
          endSec: 118.5,
          showMs: 3600,
          hideMs: 8500,
          words: [
            { text: "Matikan", time: 114.9, line: 1 },
            { text: "aku", time: 115.8, line: 1 },
            { text: "setelah", time: 116.8, line: 2 },
            { text: "usai", time: 117.6, line: 2 }
          ]
        }
      ],

      audioStartTime: 67.0,   // Mulai detik 67.0 (01:07.0)
      audioEndTime: 127.0,     // Selesai detik 127.0 (02:07.0) = Tepat 60 Detik (1 Menit)
      isLooping: true
    };

    // =========================================================================
    // CANVAS & SISTEM RENDER
    // =========================================================================
    const canvas = document.getElementById("prerender");
    const output = document.getElementById("output");
    const outputWrapper = document.getElementById("output-wrapper");
    const audioElement = document.getElementById("audio-player");
    const audioPrompt = document.getElementById("audio-prompt");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });

    // Karakter shading ASCII klasik berdensitas tinggi untuk kejelasan teks
    const charsFixed = [" ", ".", ":", "-", "=", "+", "*", "#", "%", "@"];
    const charsLength = charsFixed.length;

    let currentLyricIndex = 0;
    let lastTime = 0;
    let timeAccumulator = 0;
    let isShowing = true;
    let isPaused = false;
    let isGlitchActive = false;
    let glitchTimeout = null;

    const triggerGlitch = (duration = 140) => {
      isGlitchActive = true;
      if (outputWrapper) outputWrapper.classList.add("glitching");
      clearTimeout(glitchTimeout);
      glitchTimeout = setTimeout(() => {
        isGlitchActive = false;
        if (outputWrapper) outputWrapper.classList.remove("glitching");
      }, duration);
    };

    // Glitch periodik halus
    setInterval(() => {
      if (!isPaused && isShowing && Math.random() < 0.25) {
        triggerGlitch(80);
      }
    }, 4000);

    // =========================================================================
    // AUDIO AUTOPLAY & KONTROL
    // =========================================================================
    const playAudio = () => {
      if (!audioElement) return;
      if (audioElement.currentTime < config.audioStartTime || audioElement.currentTime >= (config.audioEndTime || 9999)) {
        audioElement.currentTime = config.audioStartTime;
      }
      const p = audioElement.play();
      if (p !== undefined) {
        p.then(() => {
          if (audioPrompt) audioPrompt.style.display = "none";
          isPaused = false;
        }).catch(() => {
          if (audioPrompt) audioPrompt.style.display = "flex";
        });
      }
    };

    const handleUserInteraction = () => {
      if (!audioElement) return;
      if (audioElement.paused) {
        playAudio();
      } else {
        audioElement.pause();
        isPaused = true;
      }
    };

    window.addEventListener("click", handleUserInteraction);
    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        handleUserInteraction();
      } else if (e.code === "ArrowRight") {
        e.preventDefault();
        currentLyricIndex = (currentLyricIndex + 1) % config.lyrics.length;
        timeAccumulator = 0;
        isShowing = true;
        triggerGlitch(160);
        if (audioElement && config.lyrics[currentLyricIndex].startSec !== undefined) {
          audioElement.currentTime = config.lyrics[currentLyricIndex].startSec;
        }
      } else if (e.code === "ArrowLeft") {
        e.preventDefault();
        currentLyricIndex = (currentLyricIndex - 1 + config.lyrics.length) % config.lyrics.length;
        timeAccumulator = 0;
        isShowing = true;
        triggerGlitch(160);
        if (audioElement && config.lyrics[currentLyricIndex].startSec !== undefined) {
          audioElement.currentTime = config.lyrics[currentLyricIndex].startSec;
        }
      }
    });

    window.addEventListener("DOMContentLoaded", () => {
      playAudio();
    });

    // =========================================================================
    // 3 TEMA MOMEN ATMOSFER DALAM BENTUK SENI ASCII
    // =========================================================================
    const drawMomentScene = (time, curTime) => {
      const cx = canvas.width / 2;
      const baseY = canvas.height - 1;

      ctx.save();

      // --- TEMA MOMEN 1: (01:07 - 01:25) FIGURAN BURAM & SMOLDERING NOIR ---
      if (curTime < 85.2) {
        // Siluet Gedung Kota Malam di dasar
        ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
        for (let x = 0; x < canvas.width; x += 6) {
          const bHeight = 8 + Math.abs(Math.sin(x * 0.28)) * 7 + (x % 5) * 1.5;
          ctx.fillRect(x, baseY - bHeight, 5, bHeight);

          // Kerlap-kerlip jendela kota
          ctx.fillStyle = "white";
          for (let wy = baseY - bHeight + 2; wy < baseY - 2; wy += 4) {
            if ((x + wy + Math.floor(time * 0.002)) % 3 === 0) {
              ctx.fillRect(x + 2, wy, 1.4, 1.4);
            }
          }
          ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
        }

        // Kepulan Asap Rokok / Hawa Misterius Melayang Naik
        ctx.strokeStyle = "rgba(255, 255, 255, 0.65)";
        ctx.lineWidth = 1.2;
        for (let s = 0; s < 3; s++) {
          const sOffset = (s - 1) * 22;
          ctx.beginPath();
          ctx.moveTo(cx + sOffset, baseY - 10);
          for (let sy = baseY - 10; sy > baseY - 26; sy -= 3) {
            const sx = cx + sOffset + Math.sin(time * 0.003 + sy * 0.18 + s) * 4;
            ctx.lineTo(sx, sy);
          }
          ctx.stroke();
        }

        // Dua Siluet Tangan Menjangkau Satu Sama Lain ("Figuran Buram")
        const reach = Math.sin(time * 0.0025) * 2;
        ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
        // Tangan Kiri
        ctx.fillRect(cx - 30 + reach, baseY - 18, 14, 3);
        ctx.fillRect(cx - 18 + reach, baseY - 20, 6, 2);
        // Tangan Kanan
        ctx.fillRect(cx + 16 - reach, baseY - 18, 14, 3);
        ctx.fillRect(cx + 12 - reach, baseY - 20, 6, 2);
      }

      // --- TEMA MOMEN 2: (01:25 - 01:45.5) ALTAR KATEDRAL BELALANG SEMBAH HIDUP ---
      else if (curTime < 105.5) {
        // Halo Busur Katedral Gothic di Belakang Belalang
        ctx.strokeStyle = "rgba(255, 255, 255, 0.45)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(cx, baseY + 8, 34, Math.PI, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(cx, baseY + 8, 28, Math.PI, Math.PI * 2);
        ctx.stroke();

        // Sinar Altar Memancar
        for (let a = Math.PI + 0.2; a < Math.PI * 2 - 0.2; a += 0.35) {
          const rx1 = cx + Math.cos(a) * 35;
          const ry1 = (baseY + 8) + Math.sin(a) * 35;
          const rx2 = cx + Math.cos(a) * 40;
          const ry2 = (baseY + 8) + Math.sin(a) * 40;
          ctx.beginPath();
          ctx.moveTo(rx1, ry1);
          ctx.lineTo(rx2, ry2);
          ctx.stroke();
        }

        // Tubuh Belalang Sembah yang Hidup & Bernapas
        const breathe = Math.sin(time * 0.003) * 1.2;
        const antennaWave = Math.sin(time * 0.005) * 2.5;

        // Kepala Segitiga
        const headY = baseY - 20 + breathe;
        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.moveTo(cx, headY);
        ctx.lineTo(cx - 5, headY - 6);
        ctx.lineTo(cx + 5, headY - 6);
        ctx.closePath();
        ctx.fill();

        // Sepasang Mata Majemuk Menyala Merah
        ctx.beginPath();
        ctx.arc(cx - 6, headY - 6, 2.2, 0, Math.PI * 2);
        ctx.arc(cx + 6, headY - 6, 2.2, 0, Math.PI * 2);
        ctx.fill();

        // Antena Panjang Meliuk
        ctx.strokeStyle = "white";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cx - 2, headY - 6);
        ctx.quadraticCurveTo(cx - 8 + antennaWave, headY - 13, cx - 15 + antennaWave * 1.5, headY - 19);
        ctx.moveTo(cx + 2, headY - 6);
        ctx.quadraticCurveTo(cx + 8 - antennaWave, headY - 13, cx + 15 - antennaWave * 1.5, headY - 19);
        ctx.stroke();

        // Batang Dada Prothorax
        ctx.lineWidth = 3.2;
        ctx.beginPath();
        ctx.moveTo(cx, headY);
        ctx.lineTo(cx, baseY - 8);
        ctx.stroke();

        // Cakar Raptorial Terlipat Berdoa "Sembah" yang Bergerak Ritmik
        ctx.lineWidth = 2.2;
        const armPray = Math.sin(time * 0.004) * 3;
        // Cakar Kiri
        ctx.beginPath();
        ctx.moveTo(cx - 2, headY + 3);
        ctx.lineTo(cx - 12 - armPray, headY - 3);
        ctx.lineTo(cx - 6 - armPray * 0.5, headY + 8);
        ctx.stroke();
        // Cakar Kanan
        ctx.beginPath();
        ctx.moveTo(cx + 2, headY + 3);
        ctx.lineTo(cx + 12 + armPray, headY - 3);
        ctx.lineTo(cx + 6 + armPray * 0.5, headY + 8);
        ctx.stroke();

        // Sayap & Perut
        ctx.beginPath();
        ctx.moveTo(cx, baseY - 8);
        ctx.lineTo(cx - 9, baseY);
        ctx.lineTo(cx + 9, baseY);
        ctx.closePath();
        ctx.fill();

        // Kaki Laba-laba Panjang
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cx - 2, baseY - 7);
        ctx.lineTo(cx - 18, baseY - 3);
        ctx.lineTo(cx - 28, baseY);
        ctx.moveTo(cx + 2, baseY - 7);
        ctx.lineTo(cx + 18, baseY - 3);
        ctx.lineTo(cx + 28, baseY);
        ctx.stroke();
      }

      // --- TEMA MOMEN 3: (01:45.5 - 02:07) MATIKAN AKU / PENGORBANAN & HUJAN ABU ---
      else {
        const isDying = curTime > 118.5;
        const fadeAlpha = isDying ? Math.max(0.12, 1 - (curTime - 118.5) / 8) : 1;

        ctx.fillStyle = `rgba(255, 255, 255, ${fadeAlpha})`;
        ctx.strokeStyle = `rgba(255, 255, 255, ${fadeAlpha})`;

        const headY = baseY - 18;
        ctx.beginPath();
        ctx.moveTo(cx, headY);
        ctx.lineTo(cx - 5, headY - 6);
        ctx.lineTo(cx + 5, headY - 6);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.arc(cx - 5.5, headY - 6, 2, 0, Math.PI * 2);
        ctx.arc(cx + 5.5, headY - 6, 2, 0, Math.PI * 2);
        ctx.fill();

        // Cakar Mengunci Rapat Menusuk ke Dalam (Fatal Strike)
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(cx - 2, headY + 2);
        ctx.lineTo(cx - 7, headY - 2);
        ctx.lineTo(cx - 1, headY + 7);
        ctx.moveTo(cx + 2, headY + 2);
        ctx.lineTo(cx + 7, headY - 2);
        ctx.lineTo(cx + 1, headY + 7);
        ctx.stroke();

        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(cx, headY);
        ctx.lineTo(cx, baseY - 7);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(cx, baseY - 7);
        ctx.lineTo(cx - 8, baseY);
        ctx.lineTo(cx + 8, baseY);
        ctx.closePath();
        ctx.fill();

        // Hujan Abu & Partikel Bara Berjatuhan Menghiasi Langit
        ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
        for (let e = 0; e < 24; e++) {
          const ex = (cx - 48) + ((e * 17 + Math.floor(time * 0.05)) % 96);
          const ey = ((e * 23 + Math.floor(time * 0.08)) % 28) + (baseY - 28);
          ctx.fillRect(ex, ey, 1.3, 1.3);
        }
      }

      ctx.restore();
    };

    // =========================================================================
    // RENDER LIRIK: KATA PER KATA MUNCUL TEPAT SESUAI PENYEBUTAN VOKAL
    // (Kata yang belum dinyanyikan tidak akan tampil di layar)
    // =========================================================================
    const drawTextToCanvas = (time) => {
      const w = canvas.width;
      const h = canvas.height;

      ctx.fillStyle = "black";
      ctx.fillRect(0, 0, w, h);

      // Dapatkan waktu audio saat ini
      let curTime = config.audioStartTime;
      if (audioElement && !audioElement.paused && audioElement.duration > 0) {
        curTime = audioElement.currentTime;
      } else {
        const item = config.lyrics[currentLyricIndex];
        const dur = item ? item.showMs : 3000;
        const frac = Math.min(1, Math.max(0, timeAccumulator / dur));
        curTime = item ? (item.startSec + frac * (item.endSec - item.startSec)) : config.audioStartTime;
      }

      // 1. Gambar 3 Tema Momen Suasana di Bagian Bawah
      drawMomentScene(time, curTime);

      // 2. Gambar Lirik yang Sedang Dinyanyikan di Bagian Atas
      if (!isShowing) return;

      const currentItem = config.lyrics[currentLyricIndex];
      if (!currentItem || !currentItem.words) return;

      // Ambil HANYA kata-kata yang sudah dinyanyikan sampai detik saat ini
      const sungWordsLine1 = currentItem.words
        .filter(w => w.line === 1 && w.time <= curTime)
        .map(w => w.text);

      const sungWordsLine2 = currentItem.words
        .filter(w => w.line === 2 && w.time <= curTime)
        .map(w => w.text);

      const textLine1 = sungWordsLine1.join(" ");
      const textLine2 = sungWordsLine2.join(" ");

      // Jika belum ada kata yang mulai dinyanyikan dalam bait ini, kosongkan
      if (!textLine1 && !textLine2) return;

      // Ukuran font tebal, bersih dan proporsional untuk keterbacaan mata
      ctx.font = `bold 15px "Segoe UI", Arial, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "white"; // Putih di kanvas = Merah menyala bersinar di ASCII

      const hasLine2 = currentItem.words.some(w => w.line === 2);
      const line1Y = hasLine2 ? 10 : 15;
      const line2Y = 23;

      if (textLine1) {
        ctx.fillText(textLine1, w / 2, line1Y);
      }
      if (textLine2) {
        ctx.fillText(textLine2, w / 2, line2Y);
      }
    };

    // =========================================================================
    // LOOP ANIMASI ASCII REAL-TIME
    // =========================================================================
    const updateASCII = (time) => {
      if (!isPaused) {
        if (audioElement && !audioElement.paused && audioElement.duration > 0) {
          const curTime = audioElement.currentTime;

          // Cek batas akhir klip 1 menit
          if (config.audioEndTime && curTime >= config.audioEndTime) {
            if (config.isLooping) {
              audioElement.currentTime = config.audioStartTime;
              currentLyricIndex = 0;
              isShowing = true;
              triggerGlitch(180);
            } else {
              isPaused = true;
              audioElement.pause();
            }
            return;
          }

          let matched = false;

          for (let i = 0; i < config.lyrics.length; i++) {
            const item = config.lyrics[i];
            if (item.startSec !== undefined && item.endSec !== undefined) {
              if (curTime >= item.startSec && curTime <= item.endSec) {
                if (currentLyricIndex !== i) {
                  currentLyricIndex = i;
                  triggerGlitch(150);
                }
                isShowing = true;
                matched = true;
                break;
              } else if (i < config.lyrics.length - 1 && curTime > item.endSec && curTime < config.lyrics[i + 1].startSec) {
                currentLyricIndex = i;
                isShowing = false;
                matched = true;
                break;
              } else if (i === config.lyrics.length - 1 && curTime > item.endSec) {
                currentLyricIndex = i;
                isShowing = false;
                matched = true;
                break;
              }
            }
          }

          if (!matched && config.lyrics.length > 0) {
            if (curTime < config.audioStartTime) {
              audioElement.currentTime = config.audioStartTime;
              isShowing = true;
            }
          }
        } else {
          // Fallback waktu jika audio ditahan browser
          if (lastTime === 0) lastTime = time;
          const deltaTime = time - lastTime;
          timeAccumulator += deltaTime;

          const currentLyric = config.lyrics[currentLyricIndex];
          const currentPhaseDuration = isShowing ? currentLyric.showMs : currentLyric.hideMs;

          if (timeAccumulator > currentPhaseDuration) {
            timeAccumulator = 0;
            if (isShowing) {
              isShowing = false;
            } else {
              isShowing = true;
              currentLyricIndex++;
              if (currentLyricIndex >= config.lyrics.length) {
                currentLyricIndex = config.isLooping ? 0 : config.lyrics.length - 1;
              }
              triggerGlitch(150);
            }
          }
        }
      }
      lastTime = time;

      drawTextToCanvas(time);

      const w = canvas.width;
      const h = canvas.height;
      const data = ctx.getImageData(0, 0, w, h).data;

      let outputText = "";
      
      for (let y = 0; y < h; y += 2) { // Sampling y step=2 untuk proporsi sempurna rasio monospace
        let row = "";
        for (let x = 0; x < w; x++) {
          const index = (x + y * w) * 4;
          const r = data[index];
          const g = data[index + 1];
          const b = data[index + 2];
          const c = (r + g + b) / 3;

          if (c < 24) {
            row += " ";
          } else {
            let char;
            if (isGlitchActive && Math.random() < 0.16) {
              const glitchGlyphs = ["†", "‡", "§", "ø", "X", "✦", "#", "!", "?"];
              char = glitchGlyphs[Math.floor(Math.random() * glitchGlyphs.length)];
            } else {
              const charIndex = Math.floor((charsLength * c) / 255);
              const safeCharIndex = Math.min(Math.max(charIndex, 0), charsLength - 1);
              char = charsFixed[safeCharIndex];
            }

            // Pewarnaan Merah Obsesif: Teks menyala terang, aset atmosferik mendukung dengan estetika sinematik
            let charColor, glow;
            if (c > 200) {
              // Teks Lirik yang sedang aktif tampil
              const brightReds = ["#ff1744", "#ff2a55", "#ff003b", "#ff3366"];
              charColor = brightReds[(x + y) % brightReds.length];
              glow = `0 0 6px ${charColor}, 0 0 16px rgba(255, 23, 68, 0.75)`;
            } else if (c > 130) {
              // Tubuh siluet ilustrasi atmosfer
              const midReds = ["#e50914", "#dc143c", "#c00028"];
              charColor = midReds[(x + y) % midReds.length];
              glow = `0 0 4px rgba(220, 20, 60, 0.5)`;
            } else if (c > 65) {
              // Sinar altar / detail halus
              charColor = "#a80020";
              glow = "none";
            } else {
              charColor = "#550010";
              glow = "none";
            }

            if (glow !== "none") {
              row += `<span style="color:${charColor};text-shadow:${glow};">${char}</span>`;
            } else {
              row += `<span style="color:${charColor};">${char}</span>`;
            }
          }
        }
        outputText += row + "\n";
      }

      output.innerHTML = outputText;

      requestAnimationFrame(updateASCII);
    };

    requestAnimationFrame(updateASCII);
  })();
</script>
